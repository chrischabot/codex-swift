name: CodexKit CI

on:
  push:
    paths: [ "codex-swift/**" ]
  pull_request:
    paths: [ "codex-swift/**" ]

jobs:
  macos:
    name: macOS build + test (primary)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: codex-swift
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release, strict concurrency)
        run: swift build -c release
      - name: Test (all gates)
        run: swift test
      - name: codexd stdio smoke
        run: bash scripts/codexd-stdio-smoke.sh

  linux:
    name: Linux portable-core regression
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: codex-swift
    steps:
      - uses: actions/checkout@v4
      - name: Install libsqlite3
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build
        run: swift build
      - name: Test
        run: swift test